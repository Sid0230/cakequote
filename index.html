<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CakeQuote — Custom Cake Pricing Calculator</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;background:#faf8f3;color:#45372f}main{background:white;padding:24px;border-radius:20px}input,select{padding:10px;margin:6px 0;width:100%;box-sizing:border-box}button{padding:10px 16px;border:0;border-radius:999px;background:#9b4d2c;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{margin-top:20px;padding:20px;background:#9b4d2c;color:white;border-radius:18px}.price{font-size:42px;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>🎂 CakeQuote</h1><p>Stop guessing what to charge. Calculate your real cost, recommended price, profit and deposit.</p><div class="grid"><label>Cake / order name<input id="name" placeholder="2-tier birthday cake"></label><label>Currency<select id="cur"><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option><option>CAD</option><option>AUD</option><option>AED</option><option>ZAR</option></select></label><label>Ingredients & materials<input id="mat" type="number" min="0" value="0"></label><label>Decoration / extras<input id="dec" type="number" min="0" value="0"></label><label>Packaging<input id="pack" type="number" min="0" value="0"></label><label>Delivery / travel<input id="del" type="number" min="0" value="0"></label><label>Other order costs<input id="other" type="number" min="0" value="0"></label><label>Hands-on hours<input id="hours" type="number" min="0" value="0"></label><label>Hourly rate<input id="rate" type="number" min="0" value="25"></label><label>Overhead<input id="over" type="number" min="0" value="0"></label><label>Target profit margin <span id="mv">30%</span><input id="margin" type="range" min="0" max="90" value="30"></label><label>Deposit <span id="dv">50%</span><input id="deposit" type="range" min="0" max="100" step="5" value="50"></label></div><div class="result"><div>Recommended customer price</div><div class="price" id="price">—</div><div id="details">Add your costs to see pricing.</div></div><p><strong>True cost:</strong> <span id="cost">—</span> · <strong>Profit:</strong> <span id="profit">—</span> · <strong>Deposit:</strong> <span id="dep">—</span> · <strong>Balance:</strong> <span id="bal">—</span></p><textarea id="quote" rows="8" style="width:100%;box-sizing:border-box" readonly>Your quote message appears here once you've added costs.</textarea><br><div style="display:flex;flex-wrap:wrap;gap:8px"><button id="copy" type="button">Copy quote</button><button id="wa" type="button">WhatsApp</button><button id="email" type="button">Email</button></div></main><script>const $=id=>document.getElementById(id),symbols={USD:'$',EUR:'€',GBP:'£',INR:'₹',CAD:'CA$',AUD:'A$',AED:'AED',ZAR:'R'};const ids=['mat','dec','pack','del','other','hours','rate','over'];function n(id){const v=parseFloat($(id).value);return Number.isFinite(v)&&v>0?v:0}function money(v){return new Intl.NumberFormat(undefined,{style:'currency',currency:$('cur').value,currencyDisplay:'narrowSymbol',minimumFractionDigits:2}).format(v)}function calc(){const cost=n('mat')+n('dec')+n('pack')+n('del')+n('other')+n('hours')*n('rate')+n('over'),m=Number($('margin').value),d=Number($('deposit').value),price=cost/(1-m/100),profit=price-cost,dep=price*d/100,bal=Math.abs(price-dep)<.005?0:price-dep;$('mv').textContent=m+'%';$('dv').textContent=d+'%';$('price').textContent=cost?money(price):'—';$('details').textContent=cost?money(cost)+' cost + '+m+'% profit margin':'Add your costs to see pricing.';$('cost').textContent=cost?money(cost):'—';$('profit').textContent=cost?money(profit):'—';$('dep').textContent=cost?money(dep):'—';$('bal').textContent=cost?money(bal):'—';let msg='';if(cost){const name=$('name').value.trim()||'Custom cake';msg='🎂 '+name+' — your quote\n\nTotal price: '+money(price)+'\n'+(d===100?'Full payment due to confirm: '+money(dep):d>0?'Deposit ('+d+'%): '+money(dep)+'\nBalance: '+money(bal):'Full payment due on pickup/delivery.')+'\n\nReply here to confirm your order or ask any questions!'}$('quote').value=msg||'Your quote message appears here once you\'ve added costs.'}ids.forEach(id=>$(id).addEventListener('input',calc));$('name').addEventListener('input',calc);$('cur').addEventListener('change',calc);$('margin').addEventListener('input',calc);$('deposit').addEventListener('input',calc);$('copy').onclick=async()=>{const btn=$('copy'),text=$('quote').value;if(!text||text.startsWith('Your quote message'))return;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const oldLabel=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=oldLabel,1600)}catch(e){btn.textContent='Copy failed';setTimeout(()=>btn.textContent='Copy quote',1600)}};$('wa').onclick=()=>{const text=$('quote').value;if(!text||text.startsWith('Your quote message'))return;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')};$('email').onclick=()=>{const text=$('quote').value;if(!text||text.startsWith('Your quote message'))return;window.location.href='mailto:?subject='+encodeURIComponent('Your custom cake quote')+'&body='+encodeURIComponent(text)};calc();</script></body></html>
